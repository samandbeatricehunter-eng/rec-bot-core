name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Keep in sync with the "packageManager" field in package.json.
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Keep in sync with .nvmrc.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @rec/shared resolves to dist/; it must be built before typecheck or
      # dependents hit phantom TS2305 missing-export errors (see CLAUDE.md).
      - name: Build shared package
        run: pnpm --filter @rec/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # The API's env.ts validates SUPABASE_URL/SERVICE_ROLE_KEY at import, and the test
        # files transitively import it. The suites are pure logic and never execute a real
        # query, so schema-satisfying placeholders are enough to let the modules load.
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
        run: pnpm test

      - name: Build all packages
        run: pnpm build:all
