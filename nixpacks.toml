# Nixpacks / Railway monorepo build.
# Each Railway service must set RAILWAY_SERVICE_NAME (or the service name) so
# `scripts/railway-build.mjs` only builds that service + @rec/shared.
# Do NOT use `pnpm -r build` here — that rebuilds api+bot+site every deploy.

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.11.0 --activate",
  "pnpm install --frozen-lockfile --prefer-offline",
  # Only the api service uses Playwright (matchup-card screenshot pipeline) -- this is a
  # multi-hundred-MB download + apt packages, so gate it on RAILWAY_SERVICE_NAME instead of
  # paying the cost on every service's build. --with-deps apt-get installs Chromium's runtime
  # shared libs (nixpacks' node image is Debian-based, so apt-get is available).
  "case \"$RAILWAY_SERVICE_NAME\" in *api*) pnpm --filter @rec/api exec playwright install --with-deps chromium ;; esac"
]

[phases.build]
cmds = ["pnpm run build"]
