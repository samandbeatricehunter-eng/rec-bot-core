# Nixpacks / Railway monorepo build.
#
# CURRENTLY NOT IN USE (confirmed 2026-08-20 via a live build log): Railway's builder for this
# project is Railpack, not Nixpacks -- it never reads this file. Build config lives in
# railpack.json at the repo root instead. Left in place (not deleted) in case the project ever
# switches builders back; don't assume edits here take effect without re-confirming which
# builder Railway is actually using for the service you're touching.
#
# Each Railway service must set RAILWAY_SERVICE_NAME (or the service name) so
# `scripts/railway-build.mjs` only builds that service + @rec/shared.
# Do NOT use `pnpm -r build` here — that rebuilds api+bot+site every deploy.

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22"]

# PLAYWRIGHT_BROWSERS_PATH=0 forces Playwright to install Chromium inside
# node_modules/playwright-core/.local-browsers instead of the default ~/.cache/ms-playwright.
# The default cache-dir location is a classic PaaS trap: the build phase and the running
# container don't always share the same $HOME/user, so a browser downloaded during install can
# be invisible to the app at runtime ("Executable doesn't exist" from chromium.launch()) even
# though the install step itself reported success. Keeping it inside node_modules ties the
# browser to the deployed app files themselves, which always persist into the runtime image.
[variables]
PLAYWRIGHT_BROWSERS_PATH = "0"

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.11.0 --activate",
  "pnpm install --frozen-lockfile --prefer-offline",
  # Only the api service uses Playwright (matchup-card screenshot pipeline) -- this is a
  # multi-hundred-MB download + apt packages, so gate it on RAILWAY_SERVICE_NAME instead of
  # paying the cost on every service's build. --with-deps apt-get installs Chromium's runtime
  # shared libs (nixpacks' node image is Debian-based, so apt-get is available).
  "case \"$RAILWAY_SERVICE_NAME\" in *api*) pnpm --filter @rec/api exec playwright install --with-deps chromium ;; esac"
]

[phases.build]
cmds = ["pnpm run build"]
